services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:@db:3306/loopstitch
      SECRET_KEY: loopstitch-docker-secret-key-change-me-in-prod
      CORS_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1,https://loopstitch.online,https://www.loopstitch.online
    restart: unless-stopped

  db:
    image: mariadb:11
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: loopstitch
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mariadb_data:
